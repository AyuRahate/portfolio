<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDna" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1017"/>
      <stop offset="100%" stop-color="#111c2a"/>
    </linearGradient>
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="gridDna" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgGradDna)"/>
  <rect width="800" height="450" fill="url(#gridDna)"/>

  <!-- Helix Strand 1 -->
  <path d="M 60 225 Q 160 120, 260 225 T 460 225 T 660 225 T 760 225" fill="none" stroke="#10b981" stroke-width="3" opacity="0.8"/>
  <!-- Helix Strand 2 -->
  <path d="M 60 225 Q 160 330, 260 225 T 460 225 T 660 225 T 760 225" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.8"/>

  <!-- Rungs / Base pairs -->
  <g stroke="#3b82f6" stroke-width="1.5" opacity="0.4">
    <line x1="160" y1="145" x2="160" y2="305"/>
    <line x1="210" y1="180" x2="210" y2="270"/>
    <line x1="310" y1="270" x2="310" y2="180"/>
    <line x1="360" y1="305" x2="360" y2="145"/>
    <line x1="510" y1="180" x2="510" y2="270"/>
    <line x1="560" y1="145" x2="560" y2="305"/>
    <line x1="610" y1="180" x2="610" y2="270"/>
  </g>

  <!-- Taxonomic Hierarchy Nodes -->
  <g transform="translate(480, 70)">
    <circle cx="80" cy="40" r="16" fill="#047857" stroke="#34d399" stroke-width="2"/>
    <circle cx="160" cy="20" r="12" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="160" cy="60" r="12" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
    <line x1="96" y1="40" x2="148" y2="20" stroke="#34d399" stroke-width="1.5"/>
    <line x1="96" y1="40" x2="148" y2="60" stroke="#34d399" stroke-width="1.5"/>

    <circle cx="230" cy="10" r="8" fill="#059669"/>
    <circle cx="230" cy="30" r="8" fill="#059669"/>
    <line x1="172" y1="20" x2="222" y2="10" stroke="#38bdf8" stroke-width="1"/>
    <line x1="172" y1="20" x2="222" y2="30" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Technical Overlay Labels -->
  <text x="50" y="405" fill="#94a3b8" font-family="monospace" font-size="13" letter-spacing="1.5">ENVIRONMENTAL DNA TAXONOMY PIPELINE // GENOMIC SEQUENCE CLASSIFICATION</text>
</svg>

