<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e14"/>
      <stop offset="100%" stop-color="#181824"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Radial Glow -->
  <circle cx="400" cy="225" r="220" fill="url(#glowGrad)"/>

  <!-- Audio Waveform / MFCC Spectral Nodes -->
  <g transform="translate(100, 180)">
    <!-- Spectrogram Bars -->
    <rect x="20" y="30" width="8" height="50" rx="4" fill="#38bdf8" opacity="0.4"/>
    <rect x="40" y="10" width="8" height="90" rx="4" fill="#38bdf8" opacity="0.6"/>
    <rect x="60" y="-10" width="8" height="130" rx="4" fill="#6366f1" opacity="0.8"/>
    <rect x="80" y="20" width="8" height="70" rx="4" fill="#6366f1" opacity="0.5"/>
    <rect x="100" y="-25" width="8" height="160" rx="4" fill="#818cf8" opacity="0.9"/>
    <rect x="120" y="15" width="8" height="80" rx="4" fill="#818cf8" opacity="0.6"/>
    <rect x="140" y="-40" width="8" height="190" rx="4" fill="#a855f7" opacity="1"/>
    <rect x="160" y="-15" width="8" height="140" rx="4" fill="#a855f7" opacity="0.8"/>
    <rect x="180" y="25" width="8" height="60" rx="4" fill="#c084fc" opacity="0.5"/>
    <rect x="200" y="-5" width="8" height="120" rx="4" fill="#c084fc" opacity="0.75"/>
    <rect x="220" y="35" width="8" height="40" rx="4" fill="#e879f9" opacity="0.4"/>
  </g>

  <!-- CNN Acoustic Feature Pipeline Graphic -->
  <g transform="translate(420, 120)">
    <!-- CNN feature map blocks -->
    <rect x="0" y="20" width="50" height="160" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.85"/>
    <rect x="80" y="45" width="40" height="110" rx="8" fill="#311042" stroke="#a855f7" stroke-width="1.5" opacity="0.85"/>
    <rect x="150" y="70" width="30" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
    <circle cx="230" cy="100" r="14" fill="#a855f7" stroke="#e879f9" stroke-width="2"/>

    <!-- Connecting neural lines -->
    <path d="M 50 100 L 80 100" stroke="#818cf8" stroke-dasharray="4,4" stroke-width="2"/>
    <path d="M 120 100 L 150 100" stroke="#a855f7" stroke-dasharray="4,4" stroke-width="2"/>
    <path d="M 180 100 L 216 100" stroke="#38bdf8" stroke-dasharray="4,4" stroke-width="2"/>
  </g>

  <!-- Continuous sine waveform line across center -->
  <path d="M 40 330 Q 140 280, 240 330 T 440 330 T 640 330 T 760 330" fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.7"/>

  <!-- Technical Overlay Labels -->
  <text x="50" y="405" fill="#94a3b8" font-family="monospace" font-size="13" letter-spacing="1.5">MFCC ACOUSTIC EXTRACTION // LIGHTWEIGHT CNN CLASSIFIER // 90% ACCURACY</text>
</svg>

