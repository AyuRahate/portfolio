    <circle cx="70" cy="115" r="45" fill="none" stroke="#d4a359" stroke-width="8" stroke-dasharray="210 282" stroke-linecap="round" transform="rotate(-90 70 115)"/>
    <text x="70" y="112" fill="#f4f0e8" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle">84%</text>
    <text x="70" y="128" fill="#d4a359" font-family="monospace" font-size="9" text-anchor="middle">TARGET: 75%</text>

