    <path d="M 388 102 L 388 114 M 388 102 L 376 102" stroke="#d4a359" stroke-width="2" fill="none"/>
    <path d="M 132 202 L 132 190 M 132 202 L 144 202" stroke="#d4a359" stroke-width="2" fill="none"/>
    <path d="M 388 202 L 388 190 M 388 202 L 376 202" stroke="#d4a359" stroke-width="2" fill="none"/>
