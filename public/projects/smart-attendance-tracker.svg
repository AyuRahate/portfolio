    <rect x="140" y="110" width="240" height="85" rx="8" fill="#121110" stroke="#33302c"/>
    <line x1="155" y1="130" x2="270" y2="130" stroke="#d4a359" stroke-width="2"/>
    <line x1="285" y1="130" x2="365" y2="130" stroke="#4ade80" stroke-width="2"/>
    <line x1="155" y1="152" x2="310" y2="152" stroke="#6f655b" stroke-width="2"/>
    <line x1="155" y1="174" x2="240" y2="174" stroke="#d4a359" stroke-width="2"/>
    <line x1="255" y1="174" x2="340" y2="174" stroke="#6f655b" stroke-width="2"/>

    <!-- OCR viewfinder corners -->
